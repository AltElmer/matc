name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64 (gcc)
            os: ubuntu-24.04
          - name: linux-arm64 (gcc)
            os: ubuntu-24.04-arm
          - name: macos-arm64 (clang)
            os: macos-14
          - name: macos-x86_64 (clang)
            os: macos-15-intel
          - name: windows-x86_64 (msvc)
            os: windows-2022
          - name: windows-x86_64 (clang-cl)
            os: windows-2022
            cmake-extra: -T ClangCL
          - name: windows-x86_64 (mingw)
            os: windows-2022
            mingw: true
          # Native arm64 Windows, on an arm64 runner with the arm64 MSVC, so
          # this is a real build for the architecture rather than an x86_64
          # binary running under emulation.
          - name: windows-arm64 (msvc)
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - name: set up mingw
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      - name: build
        if: '!matrix.mingw'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-extra }}
          cmake --build build --config Release

      - name: build (mingw)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # matc reads expressions from stdin and ignores argv, so it is driven by
      # piping input. "quit" is what ends the session; without it the process
      # waits on stdin forever, which is how a naive smoke test hangs a runner.
      - name: smoke test
        if: '!matrix.mingw'
        shell: bash
        run: |
          exe=$(find build -name 'matc' -o -name 'matc.exe' | head -1)
          echo "using: $exe"
          out=$(printf '6*7\nquit\n' | "$exe")
          echo "$out"
          echo "$out" | grep -q 42 || { echo "::error::expected 42 in output"; exit 1; }

      - name: smoke test (mingw)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          exe=$(find build -name 'matc.exe' | head -1)
          out=$(printf '6*7\nquit\n' | "$exe")
          echo "$out"
          echo "$out" | grep -q 42 || { echo "::error::expected 42 in output"; exit 1; }

  static-cli:
    name: self-contained binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: build with MATC_STATIC_CLI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMATC_STATIC_CLI=ON
          cmake --build build --config Release
      - name: it still runs
        shell: bash
        run: |
          exe=$(find build -name 'matc' -type f -o -name 'matc.exe' -type f | head -1)
          printf '6*7\nquit\n' | "$exe" | grep -q 42

  # MATC's C99 requirement used to live only in its standalone block, so a
  # project that added it with add_subdirectory inherited the parent's C
  # standard and failed to build. Nothing tested that path, which is why it
  # went unnoticed until ElmerFront consumed this repository as a submodule.
  #
  # The parent here deliberately asks for a standard MATC cannot be compiled
  # with, so this job fails if the requirement ever stops travelling with the
  # targets.
  as-subdirectory:
    name: consumed via add_subdirectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: matc

      - name: a parent project that asks for a standard MATC cannot use
        run: |
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.12)
          project(parent C)
          set(CMAKE_C_STANDARD 23)
          set(CMAKE_C_STANDARD_REQUIRED ON)
          add_subdirectory(matc)
          add_executable(consumer consumer.c)
          target_link_libraries(consumer PRIVATE matc)
          EOF
          cat > consumer.c <<'EOF'
          #include <stdio.h>
          int main(void) { printf("linked against matc\n"); return 0; }
          EOF

      - name: configure, build, run
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/consumer

      - name: the C99 requirement must have travelled with the target
        run: |
          std=$(grep -o '\-std=[a-z0-9]*' build/matc/src/CMakeFiles/matc.dir/flags.make | head -1)
          echo "matc compiled with: ${std:-<none>}"
          case "$std" in
            -std=*99|-std=gnu99) echo "ok" ;;
            *) echo "::error::matc was not compiled as C99; the target property did not travel"; exit 1 ;;
          esac